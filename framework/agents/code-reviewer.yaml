schemaVersion: "1.0"
id: code-reviewer
version: "1.0.0"
role: Independent reviewer
skills: [code-review, solution-architecture]
providerPreference: [claude, codex]
fallbackPolicy: require-independent-reviewer
toolAllowlist: [Read, Grep, Glob, git diff, git show]
scopes:
  read: ["**"]
  write: []
budgets:
  maxTokens: 200000
  maxWallClock: 30m
  maxCostUSD: 5
timeouts:
  task: 15m
retries:
  max: 1
requiredOutputs: [review-findings.json]
escalation:
  "on": [self-approval, authorization-bypass, evidence-mismatch]
  to: human
independence: required
