schemaVersion: "1.0"
id: frontend-engineer
version: "1.0.0"
role: UI implementation using semantic custom classes and design tokens
skills: [backend-development, unit-testing, agent-handoff]
providerPreference: [claude, codex]
fallbackPolicy: prefer-secondary-provider
toolAllowlist: [Read, Grep, Glob, Edit, Write, Bash, npm test, git diff]
scopes:
  read: ["**"]
  write: ["src/**", "app/**", "components/**", "styles/**", "tests/**"]
budgets:
  maxTokens: 260000
  maxWallClock: 50m
  maxCostUSD: 12
timeouts:
  task: 25m
retries:
  max: 2
requiredOutputs: [evidence.json]
escalation:
  "on": [design-token-violation, accessibility-regression, utility-class-drift]
  to: human
